version: 2

sources:
  - name: staging
    # "staging" here is the name we use in {{ source('staging', ...) }} calls
    # It maps to the actual PostgreSQL schema named "staging"
    # This is where Airflow DAGs write raw API data before dbt cleans it
    schema: staging
    description: >
      Raw staging tables populated by Airflow ingestion DAGs.
      Data lands here exactly as it comes from external APIs —
      unvalidated, unnormalised, stored as JSONB.
      dbt reads from here and transforms into the warehouse schema.

    # source freshness: dbt can check if source data is recent enough
    # If the table hasn't been updated in 25 hours, dbt warns
    # If it hasn't been updated in 48 hours, dbt errors
    # Run with: docker-compose run --rm dbt dbt source freshness
    freshness:
      warn_after: {count: 25, period: hour}
      error_after: {count: 48, period: hour}

    # loaded_at_field is the column dbt uses to check freshness
    # ingested_at is set by the DAG at insert time
    loaded_at_field: ingested_at

    tables:
      - name: raw_world_bank
        description: >
          Raw World Bank IBRD project data ingested by the world_bank DAG.
          Each row is one API response payload stored as JSONB.
          Fields used downstream: id, countryname, totalamt, boardapprovaldate.

      - name: raw_oecd
        description: >
          Raw OECD ODA data ingested by the oecd DAG.
          Stored as a single JSONB blob per ingestion run —
          SDMX-JSON format, unpacked by stg_oecd.sql using jsonb_each.

      - name: raw_sec_edgar
        description: >
          Raw SEC EDGAR filing records for Apple Inc (CIK 0000320193).
          Each row is one filing record stored as JSONB.
          Fields used downstream: _id, form, date, company, cik.