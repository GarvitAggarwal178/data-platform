version: "3.9"

networks:
  findata_net:
    driver: bridge

volumes:
  postgres_data:
  metabase_data:

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - findata_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    build: ./airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "findata_secret_key_123"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data_quality:/opt/airflow/data_quality
      - ./airflow/entrypoint.sh:/entrypoint.sh
    networks:
      - findata_net
    entrypoint: ["/bin/bash", "/entrypoint.sh"]

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./dbt:/usr/app/dbt
    working_dir: /usr/app/dbt
    networks:
      - findata_net
    profiles:
      - dbt

  api:
    build: ./api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    networks:
      - findata_net

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "3000:3000"
    networks:
      - findata_net

  metabase:
    image: metabase/metabase:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Metabase's own internal app database — separate from findata
      MB_DB_TYPE: h2
    ports:
      - "3001:3000"
    volumes:
      - metabase_data:/metabase-data
    networks:
      - findata_net